[build]
  base = "client"
  command = "npm --prefix .. run build:netlify"
  publish = "dist/storefront/browser"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefix=.. --include=dev"

# Set API_BASE_URL=https://<your-render-service>.onrender.com/api in Netlify.
# API calls go directly to Render; they do not share Netlify's proxy timeout.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
